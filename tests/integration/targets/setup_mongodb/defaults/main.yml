mongodb_version: '6.0'
apt:
  #keyserver: keyserver.ubuntu.com
  #keyserver_id: 9DA31620334BD75D9DCB49F368818C72E52529D4
  key_url: "https://pgp.mongodb.com/server-{{ mongodb_version }}.asc"
  repo: >
    deb {{ '[arch=amd64,arm64 signed-by=/etc/apt/keyrings/mongodb.asc]' if ansible_facts['distribution'] == 'Ubuntu' else '[signed-by=/etc/apt/keyrings/mongodb.asc]' }}
    https://repo.mongodb.org/apt/{{ ansible_facts['distribution']|lower }} 
    {{ ansible_facts['distribution_release'] }}/mongodb-org/{{ mongodb_version }} 
    {{ 'multiverse' if ansible_facts['distribution'] == 'Ubuntu' else 'main' }}
mongodb_packages:
  mongod: mongodb-org-server
  mongos: mongodb-org-mongos
  mongo: mongodb-org-shell
yum:
  name: mongodb-org
  description: Official MongoDB {{mongodb_version}} yum repo
  baseurl: https://repo.mongodb.org/yum/redhat/$releasever/mongodb-org/{{mongodb_version}}/x86_64/
  gpgcheck: 1
  gpgkey: https://www.mongodb.org/static/pgp/server-{{mongodb_version}}.asc
  fedoraurl: https://repo.mongodb.org/yum/amazon/2013.03/mongodb-org/{{mongodb_version}}/x86_64/
pip_packages:
  - psutil
  - pymongo
