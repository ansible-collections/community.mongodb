- ansible.builtin.import_tasks: iproute.yml

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_facts['os_family'] == 'Debian'

- name: Download MongoDB public GPG key
  ansible.builtin.get_url:
    url: "{{ apt.key_url }}"
    dest: /etc/apt/keyrings/mongodb.asc
    mode: '0644'
  when: ansible_facts['os_family'] == 'Debian'

- name: Add MongoDB repository
  ansible.builtin.apt_repository:
    repo: "{{ apt.repo }}"
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure mongod package is installed
  apt:
    name: '{{ mongodb_packages.mongod }}'
    state: present
    force: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure mongos package is installed
  ansible.builtin.apt:
    name: '{{ mongodb_packages.mongos }}'
    state: present
    force: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Ensure mongo client is installed
  ansible.builtin.apt:
    name: '{{ mongodb_packages.mongo }}'
    state: present
    force: true
  when: ansible_facts['os_family'] == 'Debian' 

- name: Add MongopDB repo
  yum_repository:
    name: '{{ yum.name }}'
    description: '{{ yum.description }}'
    baseurl: '{{ yum.baseurl }}'
    gpgcheck: '{{ yum.gpgcheck }}'
    gpgkey: '{{ yum.gpgkey }}'
  when:
  - ansible_facts['os_family'] == "RedHat"
  - not ansible_distribution == "Fedora"

- name: Another url for Fedora based systems
  ansible.builtin.yum_repository:
    name: '{{ yum.name }}'
    description: '{{ yum.description }}'
    baseurl: '{{ yum.fedoraurl }}'
    gpgcheck: '{{ yum.gpgcheck }}'
    gpgkey: '{{ yum.gpgkey }}'
  when:
  - ansible_distribution == "Fedora"

- name: Ensure mongod package is installed
  ansible.builtin.yum:
    name: '{{ mongodb_packages.mongod }}'
    state: present
  register: monogd_installed_packages
  notify: Remove mongod installed packages
  when: ansible_facts['os_family'] == "RedHat"

- name: Ensure mongos package is installed
  ansible.builtin.yum:
    name: '{{ mongodb_packages.mongos }}'
    state: present
  when: ansible_facts['os_family'] == "RedHat"

- name: Ensure mongo client is installed
  ansible.builtin.yum:
    name: '{{ mongodb_packages.mongo }}'
    state: present
  when: ansible_os_family == "RedHat"

- name: Ensure mongodb-mongosh package is installed
  ansible.builtin.package:
    name: mongodb-mongosh
    state: present
  when: mongodb_version[0] | int >= 5

- name: Install pip packages
  ansible.builtin.pip:
    name: '{{ pip_packages }}'
    state: present
  notify: remove mongodb pip packages
